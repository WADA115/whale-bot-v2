name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 语法检查
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.js,*.mjs -File |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' -and $_.FullName -notmatch '\\state\\' } |
            ForEach-Object {
              node --check $_.FullName 2>$null
              if ($LASTEXITCODE -ne 0) { Write-Host "❌ $($_.FullName)"; $bad++ }
            }
          if ($bad -gt 0) { throw "$bad 个文件语法不通过" }
          Write-Host "✅ 语法检查通过"

      - name: 测试
        run: npm test
